[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff 自有规则
]
ignore = [
    "E501", # 行长交给格式化器，报告表格允许超长
    "RUF001", # 中文全角标点
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
